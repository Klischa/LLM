name: Build and Release Android LLM APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Configure Android SDK and NDK paths
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > android/local.properties
          if [ -d "${ANDROID_HOME}/ndk/26.1.10909125" ]; then
            echo "ndk.dir=${ANDROID_HOME}/ndk/26.1.10909125" >> android/local.properties
            echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/26.1.10909125" >> $GITHUB_ENV
          else
            yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1" || true
          fi

      - name: Make gradlew executable
        run: |
          chmod +x android/gradlew || true

      - name: Build APK with Gradle
        working-directory: ./android
        run: |
          ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug --stacktrace

      - name: Locate APK files
        id: find_apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK file found in build outputs!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          sha256sum "$APK_PATH" > "${APK_PATH}.sha256"
          echo "apk_sha256=${APK_PATH}.sha256" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LLMNotes-APK
          path: ${{ steps.find_apk.outputs.apk_path }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Release ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ steps.find_apk.outputs.apk_path }}
            ${{ steps.find_apk.outputs.apk_sha256 }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
